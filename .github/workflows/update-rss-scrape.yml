name: Update VK RSS by scraping

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Prepare monthly keepalive marker
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          current_month="$(date -u +%Y-%m)"
          saved_month="$(cat .github/keepalive-month.txt 2>/dev/null || true)"

          if [ "$current_month" != "$saved_month" ]; then
            echo "$current_month" > .github/keepalive-month.txt
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install "playwright>=1.50,<2"
          python -m playwright install --with-deps chromium

      - name: Scrape VK and generate RSS
        env:
          VK_WALL_ID: "-60027733"
          VK_WALL_PATH: "wall-60027733"
          VK_SOURCE_URL: "https://vk.ru/wall-60027733"
          VK_FEED_TITLE: "doujinmusic — VK wall"
          VK_POST_LIMIT: "200"
          VK_PAGE_SIZE: "20"
          RSS_STATE_FILE: "data/feed_state.json"
          RSS_PREVIOUS_FEED_URL: "https://suteakadechi.github.io/vk-doujinmusic-rss/index.xml"
        run: python scrape_vk.py

      - name: Persist RSS item state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/feed_state.json
          if [ -f .github/keepalive-month.txt ]; then
            git add .github/keepalive-month.txt
          fi

          if git diff --cached --quiet; then
            echo "RSS state is unchanged"
            exit 0
          fi

          git commit -m "chore: update RSS item state"
          git pull --rebase origin "${{ github.event.repository.default_branch }}"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"

      - name: Upload debug files when scraping fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vk-scraping-debug
          path: debug/
          if-no-files-found: ignore
          retention-days: 7

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
